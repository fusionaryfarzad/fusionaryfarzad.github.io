<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fusionary ASCII Terminal</title>

<style>
  body {
    margin: 0;
    padding: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
    color: #00ffea;
    text-align: center;
    overflow-x: hidden;
    background: linear-gradient(270deg, #0f0c29, #302b63, #24243e);
    background-size: 600% 600%;
    animation: cyberpunkBG 15s ease infinite;
  }

  @keyframes cyberpunkBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  h1 {
    margin-top: 40px;
    font-size: 2rem;
    letter-spacing: 2px;
    text-shadow: 0 0 10px #00ffee;
  }

  pre {
    display: inline-block;
    margin-top: 40px;
    padding: 30px;
    background: rgba(0, 0, 0, 0.85);
    border: 2px solid #00ffee;
    box-shadow: 0 0 25px #00ffee;
    font-size: 14px;
    line-height: 1.2;
    text-align: left;
    white-space: pre;               /* keep ASCII rigid */
    font-variant-ligatures: none;
    letter-spacing: 0;
  }

  /* Scale down for narrow screens instead of wrapping */
  @media (max-width: 480px) {
    pre { font-size: 12px; }
  }

  /* Floating Cat (this was missing) */
  @keyframes catFloat {
    0%   { transform: translateY(0px); }
    50%  { transform: translateY(-2px); }
    100% { transform: translateY(0px); }
  }
  .cat {
    display: inline-block;
    width: 7ch;                     /* fixed visual width */
    vertical-align: baseline;
    line-height: 1;
    animation: catFloat 2s ease-in-out infinite;
    will-change: transform;
  }

  /* Fire glow (this was missing) */
  @keyframes flickerGlow {
    0%   { text-shadow: 0 0 3px #ff9100, 0 0 6px #ff3b00, 0 0 10px #ff0000; }
    50%  { text-shadow: 0 0 5px #ffc400, 0 0 10px #ff6a00, 0 0 15px #ff1a00; }
    100% { text-shadow: 0 0 3px #ff9100, 0 0 6px #ff3b00, 0 0 10px #ff0000; }
  }
  .fire {
    display: inline-block;
    margin-left: 2ch;               /* gap after F U S I O N */
    width: 10ch;                    /* frames are exactly 10 chars */
